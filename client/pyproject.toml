[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-client"
version = "0.1.0"
description = "Command-line client for FastAPI OpenAI RAG proxy"
authors = [
    { name = "ygo74", email = "yannickgobert@yahoo.fr" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "knack>=0.10.0",
    "requests>=2.25.0",
    "keyring>=23.0.0",
    "cachetools>=4.2.0",
    "urllib3 (>=2.5.0,<3.0.0)",
    "gssapi (>=1.10.0,<2.0.0)",
    "requests-kerberos (>=0.15.0,<0.16.0)",
]

[tool.poetry]
name = "ygo74.fastapi_openai_rag_client"
version = "0.1.0"
description = "client to manage FastAPI proxy for OpenAI and other LLMs"
authors = ["ygo74 <yannickgobert@yahoo.fr>"]
packages = [{ include = "ygo74", from = "src" }]


[project.scripts]
rag-client = "ygo74.fastapi_openai_rag_client.__main__:main"
